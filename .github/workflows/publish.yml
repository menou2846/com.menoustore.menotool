name: Publish VPM Listing

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v4

      - name: Read package.json
        id: pkg
        run: |
          echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
          echo "name=$(jq -r .name package.json)" >> "$GITHUB_OUTPUT"

      - name: Build zip
        run: |
          mkdir -p /tmp/dist
          zip -r "/tmp/dist/${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}.zip" . -x ".git/*" ".github/*"

      - name: Compute sha256
        id: sha
        run: echo "sha256=$(sha256sum /tmp/dist/*.zip | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Publish release asset and update index.json on main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          mkdir -p Releases
          cp /tmp/dist/*.zip "Releases/${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}.zip"
          python3 .github/scripts/update_index.py \
            "${{ steps.pkg.outputs.name }}" \
            "${{ steps.pkg.outputs.version }}" \
            "${{ steps.sha.outputs.sha256 }}" \
            "https://raw.githubusercontent.com/${{ github.repository }}/main/Releases/${{ steps.pkg.outputs.name }}-${{ steps.pkg.outputs.version }}.zip" \
            "${{ github.repository }}"
          git add Releases index.json
          git commit -m "Publish ${{ steps.pkg.outputs.name }} v${{ steps.pkg.outputs.version }}"
          git push origin main
